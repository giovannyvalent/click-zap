<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>ClickZap — Seu catálogo vende pelo WhatsApp</title>
<meta name="description" content="Crie seu catálogo, receba pedidos e leve o carrinho direto para o WhatsApp. Sem loja virtual complicada."/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f6f7f6; --card:#fff; --ink:#0b0b0b; --muted:#6f7371; --line:#e8eae9;
  --green:#16c784; --green-dark:#0ea96e; --green-soft:#e9fff6; --black:#090909;
  --shadow:0 18px 60px rgba(0,0,0,.08); --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4{font-family:Manrope,Inter,sans-serif;margin:0}
p{margin:0}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
.hidden{display:none!important}
.btn{border:0;border-radius:12px;padding:13px 17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn.dark{background:#0a0a0a;color:#fff}
.btn.green{background:var(--green);color:#071a12}
.btn.green:hover{background:#1bd893}
.btn.light{background:#fff;border:1px solid var(--line);color:#161616}
.btn.ghost{background:transparent;color:#111;padding:8px 10px}
.btn.full{width:100%}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:#eef1ef}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--green-dark)}
.logo{display:flex;align-items:center;gap:10px;font:800 24px Manrope}
.logo-mark{width:38px;height:38px;border-radius:12px;background:#0a0a0a;color:var(--green);display:grid;place-items:center;font-size:20px}
.logo b span{color:var(--green)}
.smallmuted{font-size:12px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;z-index:9999;background:#0b0b0b;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px}
.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;background:#eef1ef}
.badge.green{background:var(--green-soft);color:#087d51}
.badge.black{background:#0b0b0b;color:#fff}
.money{font-weight:800}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:11px;width:40px;height:40px;display:grid;place-items:center}
input,textarea,select{width:100%;border:1px solid #dfe3e1;background:#fff;border-radius:12px;padding:12px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,199,132,.12)}
label{display:grid;gap:7px;font-size:12px;font-weight:700;color:#2e3230}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px}
hr{border:0;border-top:1px solid var(--line)}

/* LANDING */
.landing{background:#fff}
.landing-header{height:78px;display:flex;align-items:center;justify-content:space-between}
.landing-header nav{display:flex;gap:26px;font-size:13px;color:#4f5451;font-weight:700}
.hero{background:#0a0a0a;color:#fff;overflow:hidden}
.hero-grid{min-height:620px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:45px;position:relative}
.hero-copy{padding:80px 0}
.hero .eyebrow{color:#5ef0b3}
.hero h1{font-size:clamp(42px,5vw,68px);line-height:1.03;letter-spacing:-3.2px;margin:18px 0 22px;max-width:650px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{font-size:17px;line-height:1.75;color:#b7beb9;max-width:600px}
.hero-actions{display:flex;gap:11px;margin-top:28px;flex-wrap:wrap}
.hero-bullets{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap;color:#b7beb9;font-size:12px}
.phone-stage{position:relative;min-height:520px;display:grid;place-items:center}
.phone-glow{position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(22,199,132,.16);filter:blur(2px)}
.phone{width:315px;background:#fff;border-radius:34px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative;z-index:2;color:#111;transform:rotate(3deg)}
.phone-top{height:24px;display:flex;justify-content:center}
.notch{width:92px;height:20px;background:#0b0b0b;border-radius:999px}
.phone-screen{border-radius:24px;overflow:hidden;background:#f6f7f6}
.store-mini-head{background:#fff;padding:15px;border-bottom:1px solid var(--line)}
.store-mini-head b{display:block}
.store-mini-head small{color:var(--muted)}
.mini-products{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini-product{background:#fff;border-radius:12px;padding:8px}
.mini-img{height:82px;border-radius:9px;background:linear-gradient(135deg,#131313,#303030);margin-bottom:8px}
.mini-product:nth-child(2) .mini-img{background:linear-gradient(135deg,#16c784,#0b7f54)}
.mini-product:nth-child(3) .mini-img{background:linear-gradient(135deg,#efefef,#cfcfcf)}
.mini-product:nth-child(4) .mini-img{background:linear-gradient(135deg,#222,#16c784)}
.mini-product b{font-size:10px}.mini-product small{font-size:9px;color:var(--muted)}
.mini-cart{margin:10px;background:var(--green);border-radius:12px;padding:12px;font-weight:800;font-size:11px;text-align:center}
.floatmsg{position:absolute;right:-10px;bottom:70px;background:#fff;color:#111;padding:14px;border-radius:14px;z-index:4;box-shadow:0 20px 45px rgba(0,0,0,.25);width:220px}
.floatmsg b{display:block;font-size:12px}.floatmsg small{color:var(--muted);font-size:10px}
.section{padding:92px 0}
.section-head{text-align:center;max-width:720px;margin:0 auto 42px}
.section-head h2{font-size:40px;letter-spacing:-1.8px;margin:10px 0 12px}
.section-head p{color:var(--muted);line-height:1.7}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{padding:26px;border:1px solid var(--line);border-radius:20px;background:#fff}
.step-num{width:42px;height:42px;border-radius:12px;background:#0a0a0a;color:var(--green);display:grid;place-items:center;font-weight:800;margin-bottom:30px}
.step h3{margin-bottom:9px}.step p{color:var(--muted);line-height:1.6;font-size:14px}
.darkband{background:#0b0b0b;color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.split h2{font-size:46px;letter-spacing:-2px;margin:12px 0 15px}
.split p{color:#b8beb9;line-height:1.7}
.checklist{display:grid;gap:13px;margin-top:25px}
.checkline{display:flex;gap:10px;align-items:center;font-size:14px}
.check{width:24px;height:24px;border-radius:50%;background:var(--green);color:#06170f;display:grid;place-items:center;font-weight:900}
.msgcard{background:#fff;color:#111;border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.msgcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.messagebox{background:#e7f8ef;border-radius:14px;padding:16px;white-space:pre-line;font-size:13px;line-height:1.6;border:1px solid #ccefdc}
.pricing{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:800px;margin:auto}
.pricecard{border:1px solid var(--line);border-radius:22px;padding:28px;background:#fff}
.pricecard.pro{border:2px solid var(--green);position:relative}
.pricecard h3{font-size:24px}.price{font-size:38px;font-weight:800;margin:15px 0}.price small{font-size:13px;color:var(--muted)}
.pricecard ul{padding-left:18px;color:#4e5350;line-height:1.9;font-size:14px}
.cta-band{padding:38px;border-radius:24px;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}
.cta-band h2{font-size:34px}.cta-band p{color:#adb5af;margin-top:8px}
.footer{padding:28px 0 45px;display:flex;justify-content:space-between;align-items:center;color:#747a76;font-size:12px}

/* APP */
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr;background:#f6f7f6}
.sidebar{background:#0a0a0a;color:#fff;padding:20px 16px;display:flex;flex-direction:column}
.sidebar .logo{padding:4px 7px 22px}
.business-chip{border:1px solid #242424;background:#141414;border-radius:13px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:22px}
.business-avatar{width:36px;height:36px;border-radius:10px;background:var(--green);color:#052014;display:grid;place-items:center;font-weight:900}
.business-chip small{display:block;color:#818a84;font-size:9px;text-transform:uppercase}.business-chip b{font-size:12px}
.navlabel{font-size:9px;color:#636a66;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;padding:0 9px 8px}
.nav{display:grid;gap:4px}
.nav button{border:0;background:transparent;color:#a8b0aa;border-radius:10px;padding:11px 12px;text-align:left;font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center}
.nav button:hover,.nav button.active{background:#171917;color:#fff}
.nav button.active{box-shadow:inset 3px 0 0 var(--green)}
.sidebar-foot{margin-top:auto;display:grid;gap:6px}
.side-tip{background:#131613;border:1px solid #232923;border-radius:13px;padding:13px;margin-bottom:5px}
.side-tip b{font-size:12px;display:block;margin:4px 0}.side-tip p{font-size:10px;color:#7d887f;line-height:1.5}
.main{min-width:0}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 26px}
.breadcrumb{font-size:12px;color:#8b908d}.breadcrumb b{color:#111}
.top-actions{display:flex;align-items:center;gap:9px}
.avatar{width:36px;height:36px;border-radius:50%;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-weight:800}
.content{padding:28px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.pagehead h1{font-size:32px;letter-spacing:-1.4px}.pagehead p{color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700}
.stat strong{display:block;font-size:27px;margin:10px 0 2px}
.stat small{color:#8b918d;font-size:10px}
.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.panel-pad{padding:18px}
.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.panelhead h2{font-size:17px}.panelhead p{font-size:11px;color:var(--muted);margin-top:4px}
.orderrow{display:grid;grid-template-columns:1fr 120px 120px 90px;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #f0f1f0;font-size:12px}
.orderrow:first-child{border-top:0}
.orderclient b{display:block}.orderclient small{color:var(--muted)}
.status{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:6px 8px;font-size:10px;font-weight:800}
.status.new{background:#e9fff6;color:#078354}
.status.sent{background:#eef3ff;color:#365eb3}
.status.done{background:#f1f1f1;color:#4f5551}
.quicklink{padding:18px;background:#0a0a0a;color:#fff;border-radius:16px}
.quicklink p{color:#919a94;font-size:12px;line-height:1.6;margin:8px 0 15px}
.urlbox{background:#161816;color:#8cf0c1;padding:10px;border-radius:10px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.prodcard{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px}
.prodimg{height:150px;background:linear-gradient(135deg,#111,#353535);display:grid;place-items:center;color:var(--green);font-size:36px;font-weight:900}
.prodcard:nth-child(2n) .prodimg{background:linear-gradient(135deg,#17c986,#08754e)}
.prodcard:nth-child(3n) .prodimg{background:linear-gradient(135deg,#f0f0f0,#d7d7d7);color:#111}
.prodinfo{padding:14px}
.prodinfo h3{font-size:15px}.prodinfo p{color:var(--muted);font-size:11px;line-height:1.5;margin:7px 0}
.prodmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.prodactions{display:flex;gap:7px;margin-top:12px}.prodactions button{flex:1}
.filters{display:flex;gap:10px;margin-bottom:14px}.filters input{max-width:320px}
.order-toolbar{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(4,minmax(130px,.65fr)) auto;gap:9px;align-items:center;margin-bottom:14px}
.order-toolbar input,.order-toolbar select{min-height:42px}
.viewtoggle{display:inline-flex;background:#eef0ef;padding:4px;border-radius:11px;gap:3px;justify-self:end}
.viewtoggle button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800;color:#737a76}
.viewtoggle button.active{background:#fff;color:#0b0b0b;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.filter-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px;font-size:11px;color:var(--muted)}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.kanban-col{background:#eef1ef;border:1px solid #e2e5e3;border-radius:16px;padding:12px;min-height:430px}
.kanban-head{display:flex;justify-content:space-between;align-items:center;padding:3px 3px 11px}
.kanban-head h3{font-size:13px}.kanban-count{font-size:10px;font-weight:800;background:#fff;border:1px solid var(--line);padding:5px 8px;border-radius:999px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:0 3px 10px rgba(0,0,0,.025)}
.kcard-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.kcard h4{font-size:13px}.kcard p{font-size:10px;color:var(--muted);margin-top:3px}
.kcard-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kmeta{background:#f7f8f7;border-radius:9px;padding:8px}.kmeta small{display:block;color:#8b918d;font-size:8px;text-transform:uppercase;font-weight:800}.kmeta b{display:block;font-size:11px;margin-top:3px}
.kcard-actions{display:flex;gap:7px}.kcard-actions button{flex:1;padding:9px 10px;font-size:10px}
.kcard[draggable="true"]{cursor:grab}.kcard.dragging{opacity:.42;transform:rotate(1deg)}
.kanban-col.drag-over{outline:2px dashed var(--green);outline-offset:-5px;background:#e8f8f0}
.kcard-nav{display:flex;gap:6px;margin-top:7px}.kcard-nav button{flex:1}
.outcome{display:flex;gap:6px;margin-top:9px}.outcome button{flex:1}
.outcome .selected-sold{background:#e9fff6;border-color:#b9efd7;color:#087d51}
.outcome .selected-lost{background:#fff0f0;border-color:#f1c7c7;color:#a33}
.result-badge{font-size:9px;font-weight:800;padding:5px 7px;border-radius:999px;white-space:nowrap}
.result-badge.sold{background:#e9fff6;color:#087d51}.result-badge.lost{background:#fff0f0;color:#a33}.result-badge.pending{background:#f2f3f2;color:#6d7470}
.category-list{display:grid;gap:9px}.category-row{display:grid;grid-template-columns:1fr 130px 190px;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #f0f1f0}
.category-row:first-child{border-top:0}.category-name{display:flex;align-items:center;gap:11px}.category-dot{width:38px;height:38px;border-radius:11px;background:#0a0a0a;color:var(--green);display:grid;place-items:center;font-weight:900}
.category-actions{display:flex;gap:7px;justify-content:flex-end}

.product-gallery-upload{border:1px dashed #cbd2ce;border-radius:14px;padding:14px;background:#fafbfa}
.product-gallery-upload>div:first-child{display:flex;justify-content:space-between;gap:12px;align-items:center}.product-gallery-upload p{font-size:10px;color:var(--muted);margin-top:4px}
.photo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.photo-slot{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);overflow:hidden;background:#f0f2f1;position:relative;display:grid;place-items:center;color:#a1a7a3;font-size:10px;font-weight:700}
.photo-slot img{width:100%;height:100%;object-fit:cover}.photo-slot button{position:absolute;top:5px;right:5px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:11px}
.fieldsection{border-top:1px solid var(--line);padding-top:15px;margin-top:2px}.fieldsection h3{font-size:13px;margin-bottom:11px}
.checkfield{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 12px}.checkfield input{width:auto}.checkfield span{font-size:11px;color:#4b514d}
.prodimg.has-photo,.storeproduct-img.has-photo{background:#eee;padding:0}.prodimg.has-photo img,.storeproduct-img.has-photo img{width:100%;height:100%;object-fit:cover}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9px;letter-spacing:1px;color:#8a908c;padding:12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid #f0f1f0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.formcard{padding:20px}
.formcard h2{font-size:18px;margin-bottom:4px}.formcard>p{font-size:11px;color:var(--muted);margin-bottom:18px}
.fields{display:grid;gap:14px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switchrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #f0f1f0}
.switch{width:44px;height:24px;border-radius:999px;background:#dfe4e1;padding:3px;transition:.2s}
.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:.2s}
.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* STOREFRONT */
.store{min-height:100vh;background:#f6f7f6}
.store-head{background:#0a0a0a;color:#fff}
.store-head-inner{min-height:95px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.store-brand{display:flex;gap:12px;align-items:center}.store-brand-logo{width:46px;height:46px;border-radius:14px;background:var(--green);color:#06180f;display:grid;place-items:center;font-weight:900;font-size:20px}
.store-brand small{display:block;color:#8c9690;margin-top:3px}
.store-hero{padding:36px 0 28px}
.store-hero h1{font-size:36px;letter-spacing:-1.4px}.store-hero p{color:#6d7470;margin-top:8px;max-width:620px;line-height:1.6}
.store-toolbar{display:flex;gap:10px;margin:22px 0}.store-toolbar input{max-width:420px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700;font-size:11px}.chip.active{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.store-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:120px}
.storeproduct{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.storeproduct-img{height:165px;background:linear-gradient(135deg,#0a0a0a,#2d2d2d);display:grid;place-items:center;color:var(--green);font-size:42px;font-weight:900}
.storeproduct:nth-child(2n) .storeproduct-img{background:linear-gradient(135deg,#16c784,#086340);color:#04140d}
.storeproduct:nth-child(3n) .storeproduct-img{background:linear-gradient(135deg,#eee,#d7d7d7);color:#0d0d0d}
.storeproduct-body{padding:14px}.storeproduct h3{font-size:15px}.storeproduct p{font-size:11px;line-height:1.5;color:var(--muted);height:34px;margin:7px 0 10px}
.storeproduct-bottom{display:flex;justify-content:space-between;align-items:center}
.addbtn{width:34px;height:34px;border-radius:10px;border:0;background:#0a0a0a;color:var(--green);font-weight:900;font-size:18px}
.cartbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 28px));background:#0a0a0a;color:#fff;border-radius:16px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 22px 55px rgba(0,0,0,.25);z-index:30}

function filteredOrders(){
const now=new Date(); const today=localISO(now);
const startOfWeek=(()=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return localISO(d)})();
const startOfMonth=`${today.slice(0,7)}-01`;
let list=db.orders.filter(o=>{
  const q=state.orderSearch.trim().toLowerCase();
  const hit=!q||`${o.id} ${o.client} ${o.phone}`.toLowerCase().includes(q);
  const status=state.orderStatus==='all'||o.status===state.orderStatus;
  const d=o.orderDate||today;
  let period=true;
  if(state.orderPeriod==='day') period=d===today;
  if(state.orderPeriod==='week') period=d>=startOfWeek&&d<=today;
  if(state.orderPeriod==='month') period=d>=startOfMonth&&d<=today;
  if(state.orderPeriod==='custom') period=(!state.orderStart||d>=state.orderStart)&&(!state.orderEnd||d<=state.orderEnd);
  const min=!state.orderMin||Number(o.total)>=Number(state.orderMin);
  return hit&&status&&period&&min;
});
if(state.orderSort==='value-desc') list.sort((a,b)=>b.total-a.total);
if(state.orderSort==='value-asc') list.sort((a,b)=>a.total-b.total);
if(state.orderSort==='recent') list.sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||''));
return list;
}

  return '<span class="result-badge pending">Definir resultado</span>';
}

function cartDrawer(){
const entries=Object.entries(state.cart).filter(([,q])=>q>0);
const subtotal=entries.reduce((sum,[id,q])=>sum+(db.products.find(p=>p.id===id)?.price||0)*q,0);
const checkout=state.checkout||{name:'',delivery:'Entrega',neighborhood:'',note:''};
const deliveryType=checkout.delivery || (db.business.delivery?'Entrega':'Retirada');
let shippingFee=0, neighborhood='';
if(deliveryType==='Entrega'){
  if(db.business.shippingMode==='global') shippingFee=Number(db.business.globalFee||0);
  else{
    neighborhood=checkout.neighborhood||db.business.neighborhoods?.[0]?.name||'';
    const found=(db.business.neighborhoods||[]).find(n=>n.name===neighborhood);
    shippingFee=Number(found?.fee||0);
  }
}
const total=subtotal+shippingFee;
const deliveryOptions=`${db.business.delivery?`<option ${deliveryType==='Entrega'?'selected':''}>Entrega</option>`:''}${db.business.pickup?`<option ${deliveryType==='Retirada'?'selected':''}>Retirada</option>`:''}`;
const neighborhoodSelect=deliveryType==='Entrega'&&db.business.shippingMode==='neighborhood'
  ?`<select id="delivery-neighborhood">${(db.business.neighborhoods||[]).map(n=>`<option value="${n.name}" ${neighborhood===n.name?'selected':''}>${n.name} · ${money(n.fee)}</option>`).join('')}</select>`:'';
return `<div class="drawerback" data-act="close-cart"></div><aside class="drawer">
  <div class="drawerhead"><div><span class="eyebrow">Seu pedido</span><h2>Carrinho</h2></div><button class="iconbtn" data-act="close-cart">✕</button></div>
  <div class="cartitems">${entries.map(([id,q])=>{const p=db.products.find(x=>x.id===id);return `<div class="cartitem"><div><b>${p.name}</b><small>${money(p.price)} cada</small></div><div class="qty"><button data-dec="${id}">−</button><b>${q}</b><button data-inc="${id}">+</button></div></div>`}).join('')}</div>
  <div class="cartfoot">
    <div class="shipping-line"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>
    ${deliveryType==='Entrega'?`<div class="shipping-line"><span>Frete${neighborhood?` · ${neighborhood}`:''}</span><strong>${money(shippingFee)}</strong></div>`:''}
    <div class="totalrow"><span>Total do pedido</span><strong>${money(total)}</strong></div>
    <div class="formmini">
      <input id="client-name" placeholder="Seu nome" value="${checkout.name||''}">
      <select id="delivery-type">${deliveryOptions}</select>
      ${neighborhoodSelect}
      <textarea id="client-note" rows="2" placeholder="Observação (opcional)">${checkout.note||''}</textarea>
    </div>
    <div class="msgpreview">${buildMessage(checkout.name||'Cliente',deliveryType,checkout.note||'',neighborhood)}</div>
    <button class="btn green full" data-act="send-whatsapp">Enviar pedido no WhatsApp</button>
    <div class="smallmuted" style="text-align:center;margin-top:8px">Você será direcionado para conversar com ${db.business.name}.</div>
  </div>
</aside>`;
}

function buildMessage(name='Cliente',delivery='Entrega',note='',neighborhood=''){
const entries=Object.entries(state.cart).filter(([,q])=>q>0);
const subtotal=entries.reduce((sum,[id,q])=>sum+(db.products.find(p=>p.id===id)?.price||0)*q,0);
let shippingFee=0;
if(delivery==='Entrega'){
  if(db.business.shippingMode==='global') shippingFee=Number(db.business.globalFee||0);
  else{
    const hood=neighborhood||state.checkout?.neighborhood||db.business.neighborhoods?.[0]?.name||'';
    shippingFee=Number((db.business.neighborhoods||[]).find(n=>n.name===hood)?.fee||0);
    neighborhood=hood;
  }
}
const total=subtotal+shippingFee;
let text=`Olá! Quero fazer um pedido pela ${db.business.name}. 👋\n\n🛍️ *Meu pedido*\n`;
entries.forEach(([id,q])=>{const p=db.products.find(x=>x.id===id); text+=`${q}x ${p.name} — ${money(p.price*q)}\n`;});
text+=`\n🧾 Subtotal: ${money(subtotal)}`;
if(delivery==='Entrega') text+=`\n🚚 Frete${neighborhood?` (${neighborhood})`:''}: ${money(shippingFee)}`;
text+=`\n💰 *Total: ${money(total)}*\n\n👤 ${name}\n📍 ${delivery}${neighborhood?` · ${neighborhood}`:''}`;
if(note) text+=`\n📝 Obs.: ${note}`;
text+=`\n\nPedido montado pelo ClickZap.`;
return text;
}

function render(){
  document.title='ClickZap — Seu catálogo vende pelo WhatsApp';
  let html=state.mode==='landing'?landing():state.mode==='store'?publicStore():appPage();
  if(state.modal==='product') html+=productModal();
  if(state.modal==='category') html+=categoryModal();
  if(state.modal==='order') html+=orderModal();
  $('#app').innerHTML=html;
  bind();
}

function bind(){
  $$('[data-act]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.act;
    if(a==='demo'||a==='start') go('app','overview');
    if(a==='home') go('landing');
    if(a==='store'||a==='open-store'){state.mode='store';state.category='Todos';state.query='';render();window.scrollTo(0,0)}
    if(a==='back-demo') go('app','overview');
    if(a==='copy-link'){navigator.clipboard?.writeText(`https://clickzap.app/${db.business.slug}`);toast('Link copiado!')}
    if(a==='new-product'){state.modal='product';state.editProduct=null;state.photoDraft=[];render()}
    if(a==='close-modal'){state.modal=null;state.editProduct=null;state.photoDraft=[];render()}
    if(a==='new-category'){state.modal='category';state.editCategory=null;render()}
    if(a==='close-category-modal'){state.modal=null;state.editCategory=null;render()}
    if(a==='close-order-modal'){state.modal=null;state.editOrder=null;render()}
    if(a==='open-cart'){state.drawer=true;render()}
    if(a==='close-cart'){state.drawer=false;render()}
    if(a==='upgrade') toast('Checkout do plano Pro seria aberto aqui.');
    if(a==='export') exportCSV();
    if(a==='clear-order-filters'){state.orderStatus='all';state.orderPeriod='week';state.orderStart='';state.orderEnd='';state.orderSearch='';state.orderSort='recent';state.orderMin='';render()}
    if(a==='remove-logo'){db.business.logo='';save();render()}
    if(a==='add-neighborhood'){
      const name=$('#new-neighborhood-name')?.value.trim()||'';
      const fee=Number($('#new-neighborhood-fee')?.value||0);
      if(!name) return toast('Informe o nome do bairro.');
      if((db.business.neighborhoods||[]).some(n=>n.name.toLowerCase()===name.toLowerCase())) return toast('Esse bairro já está cadastrado.');
      db.business.neighborhoods=[...(db.business.neighborhoods||[]),{id:uid(),name,fee}];save();render();toast('Bairro adicionado.');
    }
    if(a==='send-whatsapp'){
      const name=$('#client-name')?.value.trim()||'Cliente';
      const delivery=$('#delivery-type')?.value||'Entrega';
      const note=$('#client-note')?.value.trim()||'';
      const neighborhood=$('#delivery-neighborhood')?.value||state.checkout.neighborhood||'';
      state.checkout={name,delivery,neighborhood,note};
      const msg=buildMessage(name,delivery,note,neighborhood);
      toast('Pedido montado! Abrindo WhatsApp...');
      const url=`https://wa.me/${db.business.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
      setTimeout(()=>window.open(url,'_blank'),250);
    }
  });

  $$('[data-page]').forEach(el=>el.onclick=()=>{state.page=el.dataset.page;render()});
  $$('[data-cat]').forEach(el=>el.onclick=()=>{state.category=el.dataset.cat;render()});
  $$('[data-add]').forEach(el=>el.onclick=()=>{state.cart[el.dataset.add]=(state.cart[el.dataset.add]||0)+1;toast('Produto adicionado ao pedido');render()});
  $$('[data-inc]').forEach(el=>el.onclick=()=>{state.cart[el.dataset.inc]=(state.cart[el.dataset.inc]||0)+1;render()});
  $$('[data-dec]').forEach(el=>el.onclick=()=>{const id=el.dataset.dec;state.cart[id]=Math.max(0,(state.cart[id]||0)-1);if(!state.cart[id])delete state.cart[id];render()});

  $$('[data-edit]').forEach(el=>el.onclick=()=>{state.editProduct={...db.products.find(p=>p.id===el.dataset.edit)};state.photoDraft=[...(state.editProduct.photos||[])];state.modal='product';render()});
  $$('[data-toggle]').forEach(el=>el.onclick=()=>{const p=db.products.find(p=>p.id===el.dataset.toggle);p.active=!p.active;save();render()});

  $$('[data-edit-category]').forEach(el=>el.onclick=()=>{state.editCategory={...db.categories.find(c=>c.id===el.dataset.editCategory)};state.modal='category';render()});
  $$('[data-toggle-category]').forEach(el=>el.onclick=()=>{const c=db.categories.find(c=>c.id===el.dataset.toggleCategory);c.active=!c.active;save();render()});
  $$('[data-delete-category]').forEach(el=>el.onclick=()=>{const c=db.categories.find(c=>c.id===el.dataset.deleteCategory);if(db.products.some(p=>p.category===c.name))return toast('Essa categoria está em uso por produtos.');db.categories=db.categories.filter(x=>x.id!==c.id);save();render();toast('Categoria excluída.');});

  const moveOrder=(id,status)=>{const o=db.orders.find(o=>o.id===id);if(!o)return;o.status=status;if(status!=='done')o.result=null;save();if(state.modal==='order')state.editOrder={...o};render()};
  $$('[data-order-next]').forEach(el=>el.onclick=()=>{const o=db.orders.find(o=>o.id===el.dataset.orderNext);moveOrder(o.id,o.status==='new'?'sent':'done')});
  $$('[data-order-back]').forEach(el=>el.onclick=()=>{const o=db.orders.find(o=>o.id===el.dataset.orderBack);moveOrder(o.id,o.status==='done'?'sent':'new')});
  $$('[data-order-result]').forEach(el=>el.onclick=()=>{const o=db.orders.find(o=>o.id===el.dataset.orderResult);o.result=el.dataset.result;save();if(state.modal==='order')state.editOrder={...o};render()});
  $$('[data-order-view]').forEach(el=>el.onclick=()=>{state.orderView=el.dataset.orderView;render()});
  $$('[data-order-detail]').forEach(el=>el.onclick=()=>{state.editOrder={...db.orders.find(o=>o.id===el.dataset.orderDetail)};state.modal='order';render()});
  $$('[data-order-whatsapp]').forEach(el=>el.onclick=()=>{const o=db.orders.find(o=>o.id===el.dataset.orderWhatsapp);if(!o)return;const phone=String(o.phone||'').replace(/\D/g,'');const msg=`Olá, ${o.client.split(' ')[0]}! Tudo bem? Estou falando sobre o seu pedido ${o.id} no ${db.business.name}.`;window.open(`https://wa.me/55${phone.startsWith('55')?phone.slice(2):phone}?text=${encodeURIComponent(msg)}`,'_blank','noopener,noreferrer')});


  $$('[data-order-card]').forEach(card=>{card.ondragstart=e=>{card.classList.add('dragging');e.dataTransfer.setData('text/plain',card.dataset.orderCard);e.dataTransfer.effectAllowed='move'};card.ondragend=()=>card.classList.remove('dragging')});
  $$('[data-drop-status]').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('drag-over');e.dataTransfer.dropEffect='move'};col.ondragleave=()=>col.classList.remove('drag-over');col.ondrop=e=>{e.preventDefault();col.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');if(id)moveOrder(id,col.dataset.dropStatus)}});

  $$('[data-switch]').forEach(el=>el.onclick=()=>{db.business[el.dataset.switch]=!db.business[el.dataset.switch];save();render()});
  $$('[data-shipping-mode]').forEach(el=>el.onclick=()=>{db.business.shippingMode=el.dataset.shippingMode;save();render()});
  $$('[data-remove-neighborhood]').forEach(el=>el.onclick=()=>{db.business.neighborhoods=(db.business.neighborhoods||[]).filter(n=>n.id!==el.dataset.removeNeighborhood);save();render()});
  $$('[data-layout]').forEach(el=>el.onclick=()=>{db.business.storeLayout=el.dataset.layout;save();render()});
  $$('[data-preview-device]').forEach(el=>el.onclick=()=>{state.settingsPreview=el.dataset.previewDevice;render()});
  $$('[data-card-style]').forEach(el=>el.onclick=()=>{db.business.cardStyle=el.dataset.cardStyle;save();render()});
  $$('[data-image-ratio]').forEach(el=>el.onclick=()=>{db.business.imageRatio=el.dataset.imageRatio;save();render()});
  $$('[data-button-style]').forEach(el=>el.onclick=()=>{db.business.buttonStyle=el.dataset.buttonStyle;save();render()});
  $$('[data-store-toggle]').forEach(el=>el.onclick=()=>{const k=el.dataset.storeToggle;db.business[k]=!db.business[k];save();render()});


  const ps=$('#prod-search');
  if(ps) ps.oninput=e=>{state.query=e.target.value;render()};
  const sf=$('#cat-filter');
  if(sf) sf.onchange=e=>{state.category=e.target.value;render()};
  const ss=$('#store-search');
  if(ss) ss.oninput=e=>{state.query=e.target.value;render()};

  const os=$('#order-search'); if(os) os.oninput=e=>{state.orderSearch=e.target.value;render()};
  const ost=$('#order-status'); if(ost) ost.onchange=e=>{state.orderStatus=e.target.value;render()};
  const op=$('#order-period'); if(op) op.onchange=e=>{state.orderPeriod=e.target.value;if(state.orderPeriod!=='custom'){state.orderStart='';state.orderEnd=''}render()};
  const ods=$('#order-start'); if(ods) ods.onchange=e=>{state.orderStart=e.target.value;render()};
  const ode=$('#order-end'); if(ode) ode.onchange=e=>{state.orderEnd=e.target.value;render()};
  const oso=$('#order-sort'); if(oso) oso.onchange=e=>{state.orderSort=e.target.value;render()};
  const omin=$('#order-min'); if(omin) omin.oninput=e=>{state.orderMin=e.target.value;render()};

  const photoInput=$('#product-photos');
  if(photoInput) photoInput.onchange=async e=>{
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/')).slice(0,Math.max(0,5-state.photoDraft.length));
    for(const file of files){
      const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)});
      state.photoDraft.push(data);
    }
    if(files.length<e.target.files.length) toast('Limite de 5 fotos por produto.');
    render();
  };
  $$('[data-remove-photo]').forEach(el=>el.onclick=()=>{state.photoDraft.splice(Number(el.dataset.removePhoto),1);render()});

  const promoText=$('#promo-text'); if(promoText) promoText.onchange=e=>{db.business.promoText=e.target.value;save();render()};

  const colorInput=$('#brand-color');
  const colorHex=$('#brand-color-hex');
  const setBrandColor=value=>{
    if(/^#[0-9a-fA-F]{6}$/.test(value)){db.business.accentColor=value;save();render()}
  };
  if(colorInput) colorInput.onchange=e=>setBrandColor(e.target.value);
  if(colorHex) colorHex.onchange=e=>setBrandColor(e.target.value.trim());

  const gf=$('#global-fee'); if(gf) gf.onchange=e=>{db.business.globalFee=Number(e.target.value||0);save();render()};

  const businessLogo=$('#business-logo');
  if(businessLogo) businessLogo.onchange=e=>{
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader(); reader.onload=()=>{db.business.logo=reader.result;try{save()}catch(err){toast('A logo é grande demais para salvar localmente.')}render()}; reader.readAsDataURL(file);
  };

  const globalFee=$('#global-fee');
  if(globalFee) globalFee.onchange=e=>{db.business.globalFee=Math.max(0,Number(e.target.value||0));save();render()};

  const deliveryType=$('#delivery-type');
  if(deliveryType) deliveryType.onchange=e=>{state.checkout.delivery=e.target.value;render()};
  const deliveryNeighborhood=$('#delivery-neighborhood');
  if(deliveryNeighborhood) deliveryNeighborhood.onchange=e=>{state.checkout.neighborhood=e.target.value;render()};
  const clientName=$('#client-name');
  if(clientName) clientName.oninput=e=>{state.checkout.name=e.target.value};
  const clientNote=$('#client-note');
  if(clientNote) clientNote.oninput=e=>{state.checkout.note=e.target.value};

  const settingsForm=$('#settings-form');
  if(settingsForm) settingsForm.onsubmit=e=>{
    e.preventDefault(); const fd=new FormData(e.target);
    Object.assign(db.business,{
      name:String(fd.get('name')).trim(),
      slug:String(fd.get('slug')).trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-'),
      whatsapp:String(fd.get('whatsapp')).replace(/\D/g,''),
      headline:String(fd.get('headline')).trim(),
      description:String(fd.get('description')).trim()
    });
    save();toast('Configurações atualizadas.');render();
  };

  const cf=$('#category-form');
  if(cf) cf.onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.target);const name=String(fd.get('name')||'').trim();if(!name)return;
    const duplicate=db.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==state.editCategory?.id);
    if(duplicate)return toast('Já existe uma categoria com esse nome.');
    if(state.editCategory){
      const c=db.categories.find(c=>c.id===state.editCategory.id);const old=c.name;c.name=name;c.active=fd.get('active')==='on';
      db.products.forEach(p=>{if(p.category===old)p.category=name});
    }else db.categories.push({id:uid(),name,active:fd.get('active')==='on'});
    save();state.modal=null;state.editCategory=null;toast('Categoria salva.');render();
  };

  const pf=$('#product-form');
  if(pf) pf.onsubmit=e=>{
    e.preventDefault(); const fd=new FormData(e.target);
    const data={name:String(fd.get('name')).trim(),sku:String(fd.get('sku')||'').trim(),category:String(fd.get('category')||'').trim(),description:String(fd.get('description')||'').trim(),price:Number(fd.get('price')),variations:String(fd.get('variations')||'').trim(),tags:String(fd.get('tags')||'').trim(),featured:fd.get('featured')==='on',active:fd.get('active')==='on',photos:[...state.photoDraft]};
    if(state.editProduct){const idx=db.products.findIndex(p=>p.id===state.editProduct.id);db.products[idx]={...db.products[idx],...data}}
    else db.products.unshift({id:uid(),...data});
    try{save()}catch(err){toast('Produto salvo na sessão, mas as fotos são grandes demais para o armazenamento local.')}state.modal=null;state.editProduct=null;state.photoDraft=[];toast('Produto salvo.');render();
  };
}

function exportCSV(){
  const rows=[['Pedido','Cliente','Telefone','Data','Itens','Total','Status','Resultado'],...db.orders.map(o=>[o.id,o.client,o.phone,o.date,o.items,o.total,o.status,o.result==='sold'?'Vendido':o.result==='lost'?'Não vendido':''])];
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clickzap-pedidos.csv';a.click();URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
